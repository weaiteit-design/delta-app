# ============================================================
# Delta AI — Supabase Configuration
# ============================================================

[api]
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[studio]
port = 54323
api_url = "http://localhost"

[inbucket]
port = 54324
smtp_port = 54325
pop3_port = 54326

[storage]
file_size_limit = "50MiB"

[auth]
site_url = "http://localhost:3000"
additional_redirect_urls = ["https://localhost:3000"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = false

# ============================================================
# Edge Function Schedules (CRON)
# ============================================================

# Tool Discovery — daily at 6am UTC (HN + Reddit + GitHub + Product Hunt → discovery_queue)
[functions.tool-discovery]
schedule = "0 6 * * *"

# Tool Enricher — every 4 hours (Gemini extraction + embeddings → tools table)
[functions.tool-enricher]
schedule = "0 */4 * * *"

# Release Detector — every 6 hours (10 RSS feeds → releases + news_items)
[functions.release-detector]
schedule = "0 */6 * * *"
